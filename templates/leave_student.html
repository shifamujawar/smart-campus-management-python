{% extends 'base.html' %}{% block body %}
<div class="grid g2"><form method="post" class="card"><div class="card-h"><span><i class="fa-solid fa-file-medical"></i>Apply for Leave</span></div><div class="card-b"><div class="fg"><label>Leave Type</label><select name="leave_type"><option>Medical</option><option>Personal</option><option>Family</option><option>Other</option></select></div>
<div class="fgrid"><div class="fg"><label>From</label><input type="date" name="from_date" value="{{today}}" required></div><div class="fg"><label>To</label><input type="date" name="to_date" value="{{today}}" required></div></div><div class="fg"><label>Reason</label><textarea name="reason" required></textarea></div><button class="btn"><i class="fa-solid fa-paper-plane"></i> Submit Application</button></div></form>
<div class="card"><div class="card-h"><span><i class="fa-solid fa-clock-rotate-left"></i>My Leave History</span></div>{% for l in rows %}<div class="notice" style="border-left-color:var(--blue)"><h5>{{l.leave_type}} {{ status(l.status) }}</h5><p>{{l.from_date|dmy}} → {{l.to_date|dmy}} · {{l.reason}}</p></div>{% else %}{{ empty('fa-file-medical','No leave applications yet.') }}{% endfor %}</div></div>{% endblock %}
