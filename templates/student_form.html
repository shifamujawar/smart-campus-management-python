{% extends 'base.html' %}{% block body %}
<div class="crumb">Dashboard / Students / <b>{{ title }}</b></div>
<form method="post"><div class="card"><div class="card-h"><span><i class="fa-solid fa-user-plus"></i>{{ 'Edit' if s else 'Add New' }} BCA Student</span><span class="badge b-blue">BCA Department</span></div><div class="card-b">
<h4 style="color:var(--teal);margin-bottom:14px"><i class="fa-solid fa-id-card"></i> Student Information</h4><div class="fgrid">
<div class="fg"><label>Student ID <em>*</em></label><input name="student_id" value="{{ s.student_id if s }}" {{ 'readonly' if s else 'required' }}></div>
<div class="fg"><label>Full Name <em>*</em></label><input name="name" value="{{ s.name if s }}" required></div>
<div class="fg"><label>Email <em>*</em></label><input type="email" name="email" value="{{ s.email if s }}" required></div>
<div class="fg"><label>Phone</label><input name="phone" value="{{ s.phone if s and s.phone }}"></div>
<div class="fg"><label>Course</label><input value="BCA (Bachelor of Computer Applications)" readonly></div>
<div class="fg"><label>Year <em>*</em></label><select name="year">{% for y in (1,2,3) %}<option value="{{y}}" {{ 'selected' if s and s.year==y }}>{{ ['','1st','2nd','3rd'][y] }} Year</option>{% endfor %}</select></div>
<div class="fg"><label>Section</label><select name="section">{% for x in sections %}<option value="{{x}}" {{ 'selected' if s and s.section==x }}>Section {{x}}</option>{% endfor %}</select></div>
<div class="fg"><label>Gender</label><select name="gender">{% for g in ('Male','Female','Other') %}<option {{ 'selected' if s and s.gender==g }}>{{g}}</option>{% endfor %}</select></div>
<div class="fg"><label>Date of Birth</label><input type="date" name="dob" value="{{ s.dob if s and s.dob }}"></div></div>
<div class="fg"><label>Address</label><textarea name="address">{{ s.address if s and s.address }}</textarea></div>
{% if not s %}<div class="card" style="background:#f5f3ff;border-color:#ddd6fe"><div class="card-b"><label><input type="checkbox" name="create_login" id="create_login" value="1"> <b>Create Login Account</b> <span class="badge b-purple">Recommended</span></label>
 <div id="login_box" style="display:none;margin-top:12px"><div class="fgrid"><div class="fg"><label>Username</label><input name="username" placeholder="default: student id"></div><div class="fg"><label>Password</label><input name="password" placeholder="default: student123"></div></div></div></div></div>{% endif %}
<button class="btn"><i class="fa-solid fa-floppy-disk"></i> Save Student</button> <a class="btn btn-o" href="{{ url_for('students_list') }}">Cancel</a></div></div></form>{% endblock %}
