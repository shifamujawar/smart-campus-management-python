{% extends 'base.html' %}{% block body %}
<div class="card"><div class="card-h"><span><i class="fa-solid fa-user-group"></i>All BCA Students ({{rows|length}})</span></div><div class="tw"><table><thead><tr><th>ID</th><th>Name</th><th>Year</th><th>Sec</th><th>Email</th><th>Phone</th><th>Attendance</th><th></th></tr></thead><tbody>
{% for s in rows %}<tr><td>{{s.student_id}}</td><td><b>{{s.name}}</b></td><td><span class="badge b-purple">Year {{s.year}}</span></td><td>{{s.section}}</td><td>{{s.email}}</td><td>{{s.phone}}</td><td style="min-width:140px">{{ pbar(s.att_pct|int) }}</td><td><a class="ibtn" href="{{ url_for('students_view', sid=s.student_id) }}"><i class="fa-solid fa-eye"></i></a></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
